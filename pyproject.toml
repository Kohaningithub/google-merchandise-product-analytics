[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "merchandise-product-analytics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "scipy>=1.14,<2", "statsmodels>=0.14,<1", "google-cloud-bigquery>=3.27,<4", "db-dtypes>=1.3,<2", "jinja2>=3.1,<4", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "sqlglot>=30,<31", "duckdb>=1.2,<2"]
dbt = ["dbt-bigquery>=1.9,<2"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
