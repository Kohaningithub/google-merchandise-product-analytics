name: Airflow runtime contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-and-failure-propagation:
    runs-on: ubuntu-latest

    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Airflow 3.1.7
        run: |
          python -m pip install \
            'apache-airflow==3.1.7' \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.7/constraints-3.12.txt

      - name: Install project
        run: |
          python -m pip install \
            -e . \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.7/constraints-3.12.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Initialize Airflow metadata database
        run: airflow db migrate

      - name: Serialize DAGs
        run: airflow dags reserialize

      - name: Verify Airflow parse and failure propagation
        run: python scripts/verify_airflow.py --failure-check

      - name: Upload Airflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airflow-evidence
          path: artifacts/airflow-evidence.json