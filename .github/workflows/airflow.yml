name: Airflow runtime contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  parse-and-failure-propagation:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'apache-airflow==3.1.7' --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.7/constraints-3.12.txt
      - run: python -m pip install -e '.[dev,ml]'
      - run: python -m pip check
      - run: airflow db migrate
      - run: python scripts/verify_airflow.py --failure-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airflow-evidence
          path: artifacts/airflow-evidence.json
